databases:
  - name: lesiones-db
    databaseName: lesiones
    user: lesiones
    plan: free

services:
  - type: web
    name: lesiones-personales
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py sync_repository_documents && python manage.py create_admin_from_env && python serve.py
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DB_ENGINE
        value: postgresql
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "False"
      - key: DJANGO_X_FRAME_OPTIONS
        value: SAMEORIGIN
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: DJANGO_MAX_UPLOAD_SIZE
        value: "104857600"
      - key: DJANGO_ADMIN_USERNAME
        value: davidunisimon94
      - key: DJANGO_ADMIN_EMAIL
        value: davidunisimon94@gmail.com
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
      - key: POSTGRES_DB
        fromDatabase:
          name: lesiones-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: lesiones-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: lesiones-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: lesiones-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: lesiones-db
          property: port
